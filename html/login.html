<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - ClassTrack</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    "
  >
    <div class="card" style="width: 100%; max-width: 400px">
      <h2 class="text-center mb-4">Welcome Back</h2>

      <form action="admin/dashboard.html">
        <!-- Simulating Login to Admin for demo -->
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            required
            placeholder="admin@classtrack.com"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%">
          Login
        </button>
      </form>

      <div class="text-center mt-4">
        <p style="color: var(--text-muted); font-size: 0.9rem">
          Contact your administrator to register.
        </p>
        <p style="margin-top: 10px; font-size: 0.8rem">
          <a href="index.html">Back to Home</a>
        </p>
      </div>

      <div class="mt-4 text-center">
        <small style="display: block; color: var(--text-muted)"
          >Demo Links:</small
        >
        <a
          href="admin/dashboard.html"
          style="font-size: 0.8rem; color: var(--primary)"
          >View Admin Dashboard</a
        >
        |
        <a
          href="student/dashboard.html"
          style="font-size: 0.8rem; color: var(--primary)"
          >View Student Dashboard</a
        >
      </div>
    </div>
  </body>
</html>
