<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Profile - ClassTrack</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <header>
      <div class="container nav-flex">
        <a href="dashboard.html" class="logo">ClassTrack Student</a>
        <nav>
          <a href="dashboard.html" class="btn btn-outline">Back to Dashboard</a>
        </nav>
      </div>
    </header>

    <main class="container" style="padding-top: 40px; max-width: 600px">
      <h1 class="mb-4">My Profile</h1>

      <div class="card">
        <form>
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input
              type="text"
              name="full_name"
              class="form-control"
              value="John Doe"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input
              type="email"
              class="form-control"
              value="john.doe@example.com"
              disabled
              style="background: #f1f5f9; cursor: not-allowed"
            />
            <small style="color: var(--text-muted)"
              >Email cannot be changed. Contact admin for assistance.</small
            >
          </div>

          <hr
            style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0"
          />

          <div class="form-group">
            <label class="form-label"
              >New Password (Leave blank to keep current)</label
            >
            <input type="password" name="password" class="form-control" />
          </div>

          <button type="button" class="btn btn-primary" style="width: 100%">
            Update Profile
          </button>
        </form>
      </div>
    </main>
    <footer>
      <div class="container text-center">
        <p>&copy; 2026 Tuition Class Management System. All rights reserved.</p>
        <div style="margin-top: 20px; font-size: 0.9rem; color: #cbd5e1">
          <p><strong>Developed by:</strong> Dulmini Samadhi Murage</p>
          <p><strong>Student No:</strong> DIT/2025/04/141</p>
          <p>
            <strong>Course:</strong> Diploma in Information Technology (DIT 264)
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
