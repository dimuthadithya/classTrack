<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Grade 10 Science - ClassTrack</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="container nav-flex">
        <a href="dashboard.html" class="logo">ClassTrack Admin</a>
        <nav>
          <a href="courses.html" class="btn btn-outline">Back to Classes</a>
        </nav>
      </div>
    </header>

    <main class="container" style="padding-top: 40px">
      <h1 class="mb-4">Grade 10 Science: Months</h1>

      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 40px">
        <!-- Month List -->
        <div>
          <div style="display: grid; gap: 20px">
            <!-- Dummy Month 1 -->
            <div class="card">
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                "
              >
                <div>
                  <h3>January 2026</h3>
                  <p style="color: var(--success); font-weight: bold">
                    Fee: LKR 10.00
                  </p>
                </div>
                <a href="view_month.html" class="btn btn-primary"
                  >Manage Content & Students</a
                >
              </div>
            </div>
            <!-- Dummy Month 2 -->
            <div class="card">
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                "
              >
                <div>
                  <h3>February 2026</h3>
                  <p style="color: var(--success); font-weight: bold">
                    Fee: LKR 10.00
                  </p>
                </div>
                <a href="view_month.html" class="btn btn-primary"
                  >Manage Content & Students</a
                >
              </div>
            </div>
          </div>
        </div>

        <!-- Add Month Form -->
        <div>
          <div class="card" style="position: sticky; top: 100px">
            <h3>Add New Month</h3>
            <form style="margin-top: 15px">
              <div class="form-group">
                <label class="form-label">Month Name (e.g., March)</label>
                <input type="text" name="name" class="form-control" required />
              </div>
              <div class="form-group">
                <label class="form-label">Year</label>
                <input
                  type="number"
                  name="year"
                  class="form-control"
                  value="2026"
                  required
                />
              </div>
              <div class="form-group">
                <label class="form-label">Monthly Fee (LKR)</label>
                <input
                  type="number"
                  step="0.01"
                  name="fee"
                  class="form-control"
                  required
                />
              </div>
              <div class="form-group">
                <label class="form-label">Live Link (Optional)</label>
                <input type="text" name="live_link" class="form-control" />
              </div>
              <button type="button" class="btn btn-primary" style="width: 100%">
                Add Month
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
