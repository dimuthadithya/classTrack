<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - ClassTrack</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="container nav-flex">
        <a href="dashboard.html" class="logo">ClassTrack Admin</a>
        <nav>
          <a
            href="users.html"
            class="btn btn-outline"
            style="margin-right: 10px"
            >Users</a
          >
          <a
            href="courses.html"
            class="btn btn-outline"
            style="margin-right: 10px"
            >Courses</a
          >
          <a href="../login.html" class="btn btn-primary">Logout</a>
        </nav>
      </div>
    </header>

    <main class="container" style="padding-top: 40px">
      <h1 class="mb-4">Dashboard Overview</h1>

      <div
        style="
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
          gap: 20px;
        "
      >
        <div class="card">
          <h3>Total Students</h3>
          <p style="font-size: 2.5rem; font-weight: 700; color: var(--primary)">
            125
          </p>
        </div>
        <div class="card">
          <h3>Active Courses</h3>
          <p style="font-size: 2.5rem; font-weight: 700; color: var(--success)">
            8
          </p>
        </div>
        <div class="card">
          <h3>Total Enrollments</h3>
          <p
            style="font-size: 2.5rem; font-weight: 700; color: var(--text-main)"
          >
            450
          </p>
        </div>
      </div>

      <div class="mt-4">
        <h2>Quick Actions</h2>
        <div style="display: flex; gap: 15px; margin-top: 20px">
          <a
            href="users.html"
            class="card"
            style="text-align: center; color: var(--primary); width: 200px"
          >
            <i
              class="fas fa-user-plus"
              style="font-size: 2rem; margin-bottom: 10px"
            ></i>
            <div>Add Student</div>
          </a>
          <a
            href="courses.html"
            class="card"
            style="text-align: center; color: var(--success); width: 200px"
          >
            <i
              class="fas fa-plus-circle"
              style="font-size: 2rem; margin-bottom: 10px"
            ></i>
            <div>Create Course</div>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
